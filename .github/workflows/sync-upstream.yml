name: Sync upstream

# Keeps this fork current with jeffvli/feishin's stable releases, automatically. A stable
# release is whatever `GET /releases/latest` returns for that repo - GitHub excludes
# prereleases and drafts from that endpoint by definition, so no extra filtering is needed to
# stay off the alpha/beta channels.
#
# Clean merges land on main and cut a new feishin-plus release with no human step at all. Any
# merge conflict stops short of that instead: the conflicted merge is pushed to its own branch,
# conflict markers and all, and a PR opens against main so a person resolves it by hand. Nothing
# with unresolved conflicts is ever auto-published.

on:
    schedule:
        - cron: '0 12 * * *'
    workflow_dispatch:

permissions:
    actions: write
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: main

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Configure git identity
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            - name: Find latest upstream stable release
              id: upstream
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag=$(gh api repos/jeffvli/feishin/releases/latest --jq .tag_name)
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Fetch upstream tags
              run: |
                  git remote add upstream https://github.com/jeffvli/feishin.git
                  git fetch upstream --tags

            - name: Check whether this tag is already merged
              id: check
              env:
                  SYNC_TAG: ${{ steps.upstream.outputs.tag }}
              run: |
                  if git merge-base --is-ancestor "$SYNC_TAG" HEAD; then
                      echo "already_merged=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "already_merged=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Skip if a sync PR for this tag is already open
              id: existing
              if: steps.check.outputs.already_merged == 'false'
              env:
                  SYNC_TAG: ${{ steps.upstream.outputs.tag }}
              run: |
                  branch="sync/upstream-$SYNC_TAG"
                  if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Attempt merge
              id: merge
              if: steps.check.outputs.already_merged == 'false' && steps.existing.outputs.exists == 'false'
              env:
                  SYNC_TAG: ${{ steps.upstream.outputs.tag }}
              run: |
                  if git merge "$SYNC_TAG" --no-edit; then
                      echo "conflict=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "conflict=true" >> "$GITHUB_OUTPUT"
                      {
                          echo 'files<<SYNC_EOF'
                          git diff --name-only --diff-filter=U
                          echo 'SYNC_EOF'
                      } >> "$GITHUB_OUTPUT"
                  fi

            - name: Install dependencies
              if: steps.merge.outputs.conflict == 'false'
              run: pnpm install --frozen-lockfile

            - name: Bump version, commit, and publish
              if: steps.merge.outputs.conflict == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SYNC_TAG: ${{ steps.upstream.outputs.tag }}
              run: |
                  current=$(node -p "require('./package.json').version")
                  next=$(node -e "console.log(require('semver').inc('$current', 'patch'))")
                  npm pkg set version="$next"
                  git add package.json
                  git commit -m "chore(release): sync upstream $SYNC_TAG and bump to $next"
                  git push origin HEAD:main
                  gh workflow run publish.yml --ref main

            - name: Push conflicted merge and open a PR
              if: steps.merge.outputs.conflict == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SYNC_TAG: ${{ steps.upstream.outputs.tag }}
                  SYNC_FILES: ${{ steps.merge.outputs.files }}
              run: |
                  branch="sync/upstream-$SYNC_TAG"
                  git add -A
                  git commit -m "chore: merge upstream $SYNC_TAG (conflicts need manual resolution)"
                  git push origin HEAD:"$branch"

                  body_file=$(mktemp)
                  {
                      echo "Automatic merge of upstream \`$SYNC_TAG\` hit conflicts and was stopped short of \`main\` - nothing here was auto-published."
                      echo
                      echo "Conflicting files:"
                      echo '```'
                      echo "$SYNC_FILES"
                      echo '```'
                      echo
                      echo "Resolve the conflict markers on this branch and merge to let the next scheduled sync continue from there."
                  } > "$body_file"

                  gh pr create \
                      --base main \
                      --head "$branch" \
                      --title "Sync upstream $SYNC_TAG - conflicts need resolving" \
                      --body-file "$body_file"
